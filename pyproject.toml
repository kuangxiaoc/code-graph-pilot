[project]
name = "code-graph-pilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.2.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "neo4j>=6.0.3",
    "networkx>=3.4.2",
    "python-dotenv>=1.2.1",
    "rdflib>=7.5.0",
    "streamlit>=1.52.2",
    "streamlit-agraph>=0.0.45",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ 与仓库根加入 path, 使 tests 可直接 import graph_builder / ontology / benchmarks
pythonpath = ["src", "benchmarks", "."]
